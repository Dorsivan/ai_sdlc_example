---
# Grants the user cluster-wide READ-ONLY access.
# 'cluster-reader' is a built-in OpenShift ClusterRole that can read (get/list/watch)
# nearly all resources across all namespaces, but cannot create/update/delete anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: VIEWER_USERNAME-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: VIEWER_USERNAME
