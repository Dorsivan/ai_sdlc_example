---
# Reference only — NOT applied directly (applying this would OVERWRITE any
# existing identity providers). The setup script merges this provider into the
# live OAuth/cluster config instead, preserving providers already present.
#
# This is the identityProvider entry that gets added to spec.identityProviders:
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: htpasswd_provider
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: htpass-secret   # Secret in the openshift-config namespace
